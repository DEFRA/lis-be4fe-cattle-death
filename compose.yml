version: '3.4'
services:
  mongodb:
    image: mongo:7.0.28
    networks:
      - cdp-tenant
    ports:
      - '27017:27017'
    volumes:
      - mongodb-data:/data

  cattle-death:
    build: ./
    ports:
      - '3228:8085'
    links:
      - 'mongodb:mongodb'
    depends_on:
      mongodb:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:8085
      Mongo__DatabaseUri: mongodb://mongodb:27017/
      Mongo__DatabaseName: lis-be4fe-cattle-death
      # Inbound key; lis-apps-cattle-death is expected to send it as CATTLE_DEATH_API_KEY.
      ApiKeyAuthentication__Keys__0: local-dev-cattle-death-api-key
    networks:
      - cdp-tenant

volumes:
  mongodb-data:

networks:
  cdp-tenant:
    driver: bridge
